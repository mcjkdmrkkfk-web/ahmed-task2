<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة وتحليل نتائج الطلاب</title>
</head>
<body>
    <h2>افتح وحدة تحكم المتصفح (Console) باستخدام F12 أو كليك يمين > Inspect لرؤية النتائج.</h2>

    <script>
        // 1. هيكلة بيانات الطالب (Class & Constructor)
        class Student {
          constructor(id, name, grades, attendance) {
            this.id = id;
            this.name = name;
            this.grades = grades;         // مصفوفة درجات 3 مواد
            this.attendance = attendance; // نسبة الحضور الكلية (%)
          }

          // 2. دوال التحليل الأكاديمي (Methods)
          
          // دالة حساب المتوسط باستخدام reduce
          calculateAverage() {
            const totalGrades = this.grades.reduce((sum, grade) => sum + grade, 0);
            return totalGrades / this.grades.length;
          }

          // دالة تحديد التقدير بالحروف بناءً على المتوسط
          getGradeLetter(avg = this.calculateAverage()) {
            if (avg >= 90) return 'A';
            if (avg >= 80) return 'B';
            if (avg >= 70) return 'C';
            if (avg >= 60) return 'D';
            if (avg >= 50) return 'E';
            return 'F';
          }

          // دالة النتيجة النهائية (تتطلب متوسط >= 50 وحضور >= 75%)
          getStatus() {
            const avg = this.calculateAverage();
            if (avg >= 50 && this.attendance >= 75) {
              return "ناجح";
            } else {
              return "يحتاج مراجعة";
            }
          }
        }

        // 3. نظام تشغيل الجامعة (Objects Array)
        const studentsList = [
          new Student(101, "أحمد محمود", [85, 90, 88], 95), // ممتاز
          new Student(102, "سارة علي", [42, 45, 48], 80),   // متعثر (المتوسط: 45)
          new Student(103, "عمر خالد", [40, 42, 41], 70),   // متعثر (المتوسط: 41)
          new Student(104, "منى يوسف", [65, 70, 72], 88)    // جيد
        ];

        // 4. لجنة الرأفة (Array Methods)

        // الاستخراج: الطلاب الذين متوسطاتهم بين 40 و 49
        const strugglingStudents = studentsList.filter(student => {
          const avg = student.calculateAverage();
          return avg >= 40 && avg <= 49;
        });

        // المعالجة: إضافة 5 درجات رأفة لمتوسط الطلاب المتعثرين
        const boostedAverages = strugglingStudents.map(student => student.calculateAverage() + 5);

        // التحليل: جمع المتوسطات المعدلة باستخدام reduce
        const totalBoostedSum = boostedAverages.reduce((sum, avg) => sum + avg, 0);

        // متوسط الرأفة العام مع إضافة "درع الحماية" لمنع القسمة على صفر
        const strugglingCount = strugglingStudents.length;
        const averageStrugglingScore = strugglingCount > 0 ? (totalBoostedSum / strugglingCount) : 0;

        // 5. المخرجات (Console Logging)

        console.log("==========================================");
        console.log("📜 تقرير نتائج الطلاب (المصفوفة الرئيسية)");
        console.log("==========================================");
        studentsList.forEach(student => {
          const avg = student.calculateAverage();
          console.log(`الاسم: ${student.name} | المتوسط: ${avg.toFixed(2)} | التقدير: ${student.getGradeLetter(avg)} | النتيجة: ${student.getStatus()}`);
        });

        console.log("\n==========================================");
        console.log("🛠️ لجنة الرأفة - قائمة الطلاب المتعثرين ومعالجاتهم");
        console.log("==========================================");
        strugglingStudents.forEach((student, index) => {
          const originalAvg = student.calculateAverage();
          const boostedAvg = boostedAverages[index];
          console.log(`الطالب: ${student.name} | المتوسط الأصلي: ${originalAvg.toFixed(2)} | بعد الرأفة (+5): ${boostedAvg.toFixed(2)}`);
        });

        console.log("\n==========================================");
        console.log(`📊 المتوسط العام للطلاب المتعثرين بعد الرأفة: ${averageStrugglingScore.toFixed(2)}`);
        console.log("==========================================");
    </script>
</body>
</html>
